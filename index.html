<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    
    <link href="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack.min.css" rel="stylesheet"/>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav id="toolbar">
        <div class="nav-group tabs" id="screen-tabs">
            </div>

        <div class="nav-group controls">
            <select id="add-widget-select">
                <option value="" disabled selected>+ Add Widget</option>
                <option value="clock">Clock</option>
                <option value="stopwatch">Stopwatch</option>
                <option value="timer">Timer</option>
                <option value="music">Music Player</option>
            </select>
            
            <button id="btn-stop-audio" class="btn warning">Stop All Audio</button>
            <button id="btn-edit-mode" class="btn toggle">Edit Mode: OFF</button>
            <button id="btn-gravity" class="btn toggle">Gravity: ON</button>
            
            <div class="grid-controls">
                <label for="grid-cols">Grid Size:</label>
                <input type="number" id="grid-cols" min="2" max="50" value="12">
            </div>

            <button id="btn-import" class="btn">Import</button>
            <input type="file" id="file-import" accept=".json" style="display: none;">
            <button id="btn-export" class="btn">Export</button>
        </div>
    </nav>

    <main id="workspace">
        </main>

    <!-- GLOBAL SETTINGS MODAL -->
    <div id="audio-settings-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Audio Settings</h2>
                <button id="btn-close-modal" class="btn">X</button>
            </div>
            <div class="modal-body" style="display: flex; flex-direction: column; gap: 15px; margin-top: 10px;">
                <div class="form-group">
                    <label>Audio URL:</label>
                    <input type="text" id="modal-audio-url" class="btn" style="text-align: left; cursor: text;" placeholder="https://...">
                </div>
                <div class="form-group">
                    <label>Or Local File:</label>
                    <input type="file" id="modal-audio-file" accept="audio/*" class="btn">
                </div>
                <div class="form-row">
                    <div class="form-group"><label>Start (sec):</label><input type="number" id="modal-audio-start" min="0" value="0"></div>
                    <div class="form-group"><label>End (sec, 0=Full):</label><input type="number" id="modal-audio-end" min="0" value="0"></div>
                </div>
                <div class="form-group"><label>Total Loop Duration (sec, 0=Play Once):</label><input type="number" id="modal-audio-duration" min="0" value="0"></div>
                <div class="form-row" style="margin-top: 5px;">
                    <button id="btn-modal-preview" class="btn">Preview</button>
                    <button id="btn-modal-stop" class="btn warning">Stop</button>
                </div>
                <button id="btn-modal-save" class="btn active" style="background: var(--accent-color); color: white; margin-top: 10px;">Save Settings</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/gridstack@10.0.1/dist/gridstack-all.js"></script>
    <script src="script.js"></script>
</body>
</html>
